<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'">
<title>RigStash</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="win">
  <aside class="side">
    <div class="logo"><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span class="word">RigStash</span></div>
    <nav class="nav">
      <button class="head" data-tab="all">My Games</button>
      <button class="sub on" data-tab="all">All games</button>
      <button class="sub" data-tab="steam">Steam</button>
      <button class="sub" data-tab="epic">Epic</button>
      <button class="sub" data-tab="gog">GOG</button>
      <button class="sub" data-tab="manual">Added by me</button>
      <button class="fav" data-tab="fav">
        <svg width="12" height="14" viewBox="0 0 20 22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 2h14v18l-7-5-7 5z"/></svg>Favorite</button>
    </nav>
    <div class="me"><div class="av"></div><span id="pcname">My PC</span></div>
  </aside>

  <main class="main">
    <div class="bar">
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" placeholder="Search games" aria-label="Search games">
      </label>
      <button class="sq" id="refresh" aria-label="Rescan games" title="Rescan installed games">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
      </button>
      <div class="ctl">
        <button id="wmin" aria-label="Minimize">–</button>
        <button id="wmax" aria-label="Maximize">▢</button>
        <button id="wclose" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <button class="add" id="add" aria-label="Add a game" title="Add a game">+</button>
    <div class="toast" id="toast" role="status"></div>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2>Add a game</h2>
    <label>Name<input id="f-name" required autocomplete="off"></label>
    <label>Game file
      <span class="row"><input id="f-exe" placeholder="Choose the game's .exe" readonly><button type="button" id="f-browse">Browse</button></span>
    </label>
    <label>Steam App ID <small>(for the cover picture, and to launch through Steam)</small>
      <input id="f-steam" inputmode="numeric" placeholder="e.g. 1091500" autocomplete="off">
    </label>
    <p class="err" id="f-err"></p>
    <div class="actions"><button type="button" id="f-cancel">Cancel</button><button type="submit" class="primary">Add game</button></div>
  </form>
</dialog>
<script src="renderer.js"></script>
</body>
</html>
